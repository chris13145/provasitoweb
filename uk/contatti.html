<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакти — Forno Lievita</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">Forno Lievita</a>
      <nav class="nav">
        <a href="index.html">Головна</a>
        <a href="chi-siamo.html">Про нас</a>
        <a href="contatti.html" class="nav-active">Контакти</a>
        <a href="../contatti.html" class="lang-switch" onclick="localStorage.setItem('lingua-preferita','it')">IT</a>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="wrap">
      <h1>Завітайте до нас</h1>
    </div>
  </section>

  <section class="content">
    <div class="wrap wrap-narrow">
      <div class="contact-grid">
        <div>
          <h2>Де ми знаходимось</h2>
          <p>Via dei Mille 12<br>24121 Бергамо (BG)</p>
          <h2>Телефон</h2>
          <p>035 123 4567</p>
          <h2>Електронна пошта</h2>
          <p>ciao@fornolievita.it</p>
        </div>

        <!-- Nota per chi impara: questo form non invia davvero l'email —
             un sito statico non può farlo da solo. Servirebbe un servizio
             come Formspree, oppure un piccolo backend. -->
        <form class="contact-form">
          <label for="nome">Ім'я</label>
          <input type="text" id="nome" name="nome" required>

          <label for="email">Електронна пошта</label>
          <input type="email" id="email" name="email" required>

          <label for="messaggio">Повідомлення</label>
          <textarea id="messaggio" name="messaggio" rows="5" required></textarea>

          <button type="submit" class="button">Надіслати повідомлення</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Forno Lievita — Via dei Mille 12, Бергамо</p>
    </div>
  </footer>

</body>
</html>
