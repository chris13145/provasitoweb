<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti — Forno Lievita</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="logo">Forno Lievita</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="chi-siamo.html">Chi siamo</a>
        <a href="contatti.html" class="nav-active">Contatti</a>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="wrap">
      <h1>Vieni a trovarci</h1>
    </div>
  </section>

  <section class="content">
    <div class="wrap wrap-narrow">
      <div class="contact-grid">
        <div>
          <h2>Dove siamo</h2>
          <p>Via dei Mille 12<br>24121 Bergamo (BG)</p>
          <h2>Telefono</h2>
          <p>035 123 4567</p>
          <h2>Email</h2>
          <p>ciao@fornolievita.it</p>
        </div>

        <!-- 
          Un semplice modulo di contatto. NOTA PER CHI IMPARA: 
          questo form non invia davvero l'email da solo — un sito statico 
          (solo HTML/CSS) non può farlo. Per farlo funzionare davvero, in futuro 
          userai un servizio come Formspree, oppure un piccolo backend.
          Per ora serve a esercitarsi con i tag <form>, <label>, <input>.
        -->
        <form class="contact-form">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="messaggio">Messaggio</label>
          <textarea id="messaggio" name="messaggio" rows="5" required></textarea>

          <button type="submit" class="button">Invia messaggio</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Forno Lievita — Via dei Mille 12, Bergamo</p>
    </div>
  </footer>

</body>
</html>
